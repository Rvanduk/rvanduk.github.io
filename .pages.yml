media:
  input: media
  output: /media
  rename: safe
content:
  - name: posts
    label: Записи дневника
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, category, project, published]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Заголовок
        type: string
        required: true
      - name: date
        label: Дата публикации
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: Раздел журнала
        type: select
        default: Разработка
        options:
          values: [Разработка, Играю, Пишу, Заметки]
      - name: project
        label: Проект (необязательно, впиши название)
        type: string
        default: Мастерская
      - name: excerpt
        label: Короткое описание
        type: text
      - name: cover
        label: Обложка (необязательно)
        type: image
      - name: published
        label: Опубликовано
        type: boolean
        default: true
      - name: body
        label: Текст записи
        type: rich-text
        options:
          format: markdown

  - name: projects
    label: Мои проекты
    type: collection
    path: content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, status, published]
      primary: title
    fields:
      - name: title
        label: Название проекта
        type: string
        required: true
      - name: description
        label: Краткое описание
        type: text
      - name: status
        label: Статус
        type: select
        default: В разработке
        options:
          values: [В разработке, Эксперимент, Приостановлен, Готов]
      - name: cover
        label: Обложка
        type: image
      - name: download
        label: Ссылка на игру или сборку
        type: string
      - name: published
        label: Показывать на сайте
        type: boolean
        default: true
      - name: body
        label: Подробнее о проекте
        type: rich-text
        options:
          format: markdown
