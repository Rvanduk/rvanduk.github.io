name: Publish diary
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "build_site.py"
      - "content/posts/**"
      - "content/projects/**"
      - "media/**"
      - "assets/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install "PyYAML==6.0.2" "Markdown==3.7" "Pillow==11.3.0"
      - name: Build website
        run: python build_site.py
      - name: Validate generated site
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          root = Path("_site")
          for name in ["index.html", "archive/index.html", "projects/index.html", "rss.xml", "sitemap.xml", "robots.txt", "assets/side-quest-mark.svg"]:
              assert (root/name).is_file(), f"Missing {name}"
          ElementTree.parse(root/"rss.xml")
          ElementTree.parse(root/"sitemap.xml")
          assert list((root/"projects").glob("*/index.html")), "Missing project pages"
          print("Side Quest smoke tests passed")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
